services:
  - type: web
    name: omixbooks
    runtime: node
    buildCommand: pnpm install --no-frozen-lockfile && pnpm run build
    startCommand: pnpm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: omixbooks-db
          property: connectionString
      - key: NODE_ENV
        value: production
    plan: free

databases:
  - name: omixbooks-db
    plan: free
